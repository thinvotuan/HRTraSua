{% extends 'base.html' %}
{% block title %}{{ 'Sửa' if pos else 'Thêm' }} chức vụ - HR Thealley{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0">
        <i class="bi bi-award me-2 text-primary"></i>
        {{ 'Cập nhật chức vụ' if pos else 'Thêm chức vụ mới' }}
    </h4>
    <a href="{{ url_for('positions.index') }}" class="btn btn-sm btn-outline-secondary">
        <i class="bi bi-arrow-left me-1"></i>Quay lại
    </a>
</div>

<div class="card border-0 shadow-sm" style="max-width:500px">
    <div class="card-body">
        <form method="post">
            <div class="mb-3">
                <label class="form-label fw-medium">Tên chức vụ <span class="text-danger">*</span></label>
                <input type="text" name="name" class="form-control"
                       value="{{ pos.name if pos else (form_data.name if form_data else '') }}"
                       required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-medium">Phòng ban <span class="text-danger">*</span></label>
                <select name="department_id" class="form-select" required>
                    <option value="">-- Chọn phòng ban --</option>
                    {% set sel_dept = pos.department_id if pos else (form_data.department_id|int if form_data and form_data.department_id else 0) %}
                    {% for d in departments %}
                    <option value="{{ d.id }}" {% if sel_dept == d.id %}selected{% endif %}>
                        {{ d.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label fw-medium">Mức lương cơ bản (VNĐ)</label>
                <input type="number" name="base_salary" class="form-control" min="0" step="100000"
                       value="{{ pos.base_salary|int if pos else (form_data.base_salary if form_data else 0) }}">
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-save me-1"></i>{{ 'Cập nhật' if pos else 'Thêm mới' }}
                </button>
                <a href="{{ url_for('positions.index') }}" class="btn btn-outline-secondary">Hủy</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
