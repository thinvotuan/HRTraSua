{% extends 'base.html' %}
{% block title %}{{ 'Sửa' if dept else 'Thêm' }} phòng ban - HR Thealley{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0">
        <i class="bi bi-diagram-3 me-2 text-primary"></i>
        {{ 'Cập nhật phòng ban' if dept else 'Thêm phòng ban mới' }}
    </h4>
    <a href="{{ url_for('departments.index') }}" class="btn btn-sm btn-outline-secondary">
        <i class="bi bi-arrow-left me-1"></i>Quay lại
    </a>
</div>

<div class="card border-0 shadow-sm" style="max-width:500px">
    <div class="card-body">
        <form method="post">
            <div class="mb-3">
                <label class="form-label fw-medium">Tên phòng ban <span class="text-danger">*</span></label>
                <input type="text" name="name" class="form-control"
                       value="{{ dept.name if dept else (form_data.name if form_data else '') }}"
                       required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-medium">Mô tả</label>
                <textarea name="description" class="form-control" rows="3">{{ dept.description if dept else (form_data.description if form_data else '') }}</textarea>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-save me-1"></i>{{ 'Cập nhật' if dept else 'Thêm mới' }}
                </button>
                <a href="{{ url_for('departments.index') }}" class="btn btn-outline-secondary">Hủy</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
